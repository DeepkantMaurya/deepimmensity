<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Immensity</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: serif;
            background-color: #f0f0f2;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        .img-one {
            max-width: 250px;
            height: auto;
            margin-bottom: 1.5rem;
        }
        h1.brand {
            color: #2a6f97;
            font-size: 1.8rem;
            font-weight: normal;
            margin-bottom: 3rem;
            letter-spacing: -0.5px;
        }
        h2.headline {
            color: #2a6f97;
            font-size: 2.5rem;
            font-weight: normal;
            line-height: 1.2;
            margin-bottom: 2rem;
        }
        p.description {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            color: #222;
        }
        .btn {
            display: inline-block;
            background-color: #2a6f97;
            color: #ffffff;
            padding: 0.9rem 2.5rem;
            text-decoration: none;
            font-size: 1rem;
            font-family: sans-serif;
            border-radius: 2px;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #205473;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Optional Image/Logo -->
        <img src="./Abc.png" alt="Deep Immensity" class="img-one">

        <h1 class="brand">Deep Immensity</h1>
        
        <h2 class="headline">Build products to transform</h2>
        
        <p class="description">
            At DeepImmensity we focus to build software products which you own to transform the experience. We provide the best enterprise level technology integration.
        </p>
        
        <a href="#contact" class="btn">Contact us</a>
    </div>

</body>
</html>
